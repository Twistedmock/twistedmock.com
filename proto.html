<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>abyss — prototype</title>
<link rel="stylesheet" href="assets/css/fonts.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#03070C;color:#DCEEF2;
    font-family:"Inter",system-ui,sans-serif;overflow:hidden}
  .stage{position:fixed;inset:0;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(46,150,165,.20), transparent 62%),
      linear-gradient(#04121C 0%, #030C15 42%, #020609 100%);}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .t{position:absolute;left:0;right:0;top:46%;text-align:center;
     font-family:"Newsreader",Georgia,serif;font-weight:200;
     font-size:clamp(3rem,10vw,8rem);line-height:.95;letter-spacing:-.02em;
     text-shadow:0 0 60px rgba(3,7,12,.9)}
  .t em{font-style:italic;color:#8FF0DE}
  .d{position:absolute;left:2rem;bottom:2rem;font-family:"JetBrains Mono",monospace;
     font-size:.625rem;letter-spacing:.2em;color:#4FC9C0;opacity:.75}
  .h{position:absolute;right:2rem;bottom:2rem;font-family:"JetBrains Mono",monospace;
     font-size:.625rem;letter-spacing:.2em;color:#3E7C86}
</style>
</head>
<body>
<div class="stage">
  <canvas id="cv"></canvas>
  <div class="t"><em>Mahmud</em> Hasan Sizan</div>
  <div class="d" id="dep">DEPTH 0 M · EPIPELAGIC</div>
  <div class="h">move to disturb the water · click to flare</div>
</div>
<script type="module">
  import { Abyss } from './assets/js/abyss.js';
  const a = new Abyss(document.getElementById('cv'));
  window.__a = a;
  // demo: cycle depth so I can see how it dims
  window.setD = (d) => { a.setDepth(d);
    document.getElementById('dep').textContent =
      `DEPTH ${Math.round(d*6000)} M · ${d<.15?'EPIPELAGIC':d<.35?'MESOPELAGIC':d<.6?'BATHYPELAGIC':d<.85?'ABYSSOPELAGIC':'HADAL'}`;
  };
  window.setD(0);
</script>
</body>
</html>
